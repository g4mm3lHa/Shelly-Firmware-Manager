# Konfiguration der App-Seite auf Deutsch: nur das Hinweisfeld "settings" (config.yaml);
# alle Optionen stehen im Tab „Einstellungen“ der App.
configuration:
  settings:
    name: "Alle Einstellungen: App öffnen → Tab „Einstellungen“"
    description: >-
      Diese Seite hat keine weiteren Optionen. Öffne die App über „Shelly Firmware“ in der Seitenleiste und wähle den Tab „Einstellungen“. Eingaben in diesem Feld haben keine Wirkung.
network:
  8098/tcp: Firmware-Downloads für die Shellys

