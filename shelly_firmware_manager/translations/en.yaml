configuration:
  check_interval_days:
    name: Check every (days)
    description: Automatic check every 1-30 days.
  check_time:
    name: Check time
    description: Time of the automatic check (HH:MM, time zone of Home Assistant).
  download_base_url:
    name: Download base URL for the Shellys
    description: >-
      LAN IP address of Home Assistant and port 8098, e.g. http://192.0.2.10:8098 (use the IP, not a host name). Required: installations are refused until it is set.
  restrict_downloads_to_devices:
    name: Serve downloads only to known Shellys
  max_parallel_installs:
    name: Max. parallel installations
    description: Maximum number of approved updates installed at the same time (1-20); further approvals wait.
  gen1_updates_enabled:
    name: Enable Gen1 updates
    description: >-
      Gen1 firmware is offered by Shelly only via plain HTTP without a checksum. Switch off to skip Gen1 devices.
  allow_downgrade:
    name: Allow downgrades
    description: >-
      Allows installing an older stored firmware on Gen2+ devices (device menu and Firmware tab). Off by default.
  import_max_mb:
    name: Max. import size (MB)
    description: Largest firmware store export accepted by "Import store" (1-2048 MB).
  log_retention_days:
    name: Log retention (days)
  log_entry_limit:
    name: Max. log size (entries)
    description: 100-3000 entries.
  gen1_allowed_types:
    name: Allowed Gen1 types
  pinned_certificates:
    name: Pinned certificates
    description: >-
      Host and SHA-256 fingerprint for Shelly servers using the private Allterco CA. Multiple entries per host are allowed.
network:
  8098/tcp: Firmware downloads for the Shellys
