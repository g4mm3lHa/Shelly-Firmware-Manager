# Names and help texts of the Configuration tab of the app page: the same as the
# Settings tab (OPTION_FIELDS in ui-src/js/app-settings.js), in the same order.
configuration:
  check_interval_days:
    name: Check every (days)
    description: 1–30 days
  check_time:
    name: Check time
    description: Local time of Home Assistant
  download_base_url:
    name: Download base URL for the Shellys
    description: >-
      LAN IP address of Home Assistant + host port 8098, e.g. http://192.168.1.20:8098 (no host name; IP addresses only in private networks). Required for installations
  restrict_downloads_to_devices:
    name: Serve downloads only to known Shellys
    description: Switch off if downloads are rejected from 172.30.x.x
  gen1_updates_enabled:
    name: Enable Gen1 updates
    description: Gen1 firmware is only available via plain HTTP without a checksum
  allow_downgrade:
    name: Allow downgrades
    description: >-
      Installing an older stored firmware on Gen2+ devices (device menu and Firmware tab); off by default
  import_max_mb:
    name: Max. import size (MB)
    description: >-
      Largest file accepted by “Import store” (Settings → Firmware & Storage); 1–2048, default 100
  log_entry_limit:
    name: Max. log size (entries)
    description: 100–3000
  log_retention_days:
    name: Log retention (days)
    description: 1–365
  max_parallel_installs:
    name: Max. parallel installations
    description: 1–20; further approvals wait
  resolve_host_names:
    name: Resolve host names
    description: >-
      Looks up each device's host name (<device id>.local) at every check and shows the column “Host name”; off by default
  pinned_certificates:
    name: Pinned certificates
    description: >-
      Host below shelly.cloud + SHA-256 fingerprint; several entries per host allowed
network:
  8098/tcp: Firmware downloads for the Shellys
