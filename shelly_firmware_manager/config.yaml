name: Firmware Manager for Shelly
slug: shelly_firmware_manager
url: https://github.com/g4mm3lHa/Shelly-Firmware-Manager
description: >-
  Keeps Shelly devices (Gen1 to Gen4) up to date locally: checks, stores and
  installs firmware after your approval.
# Not next to "name": the beta branch changes the name, every release the version
version: "3.12.1-rc1"
arch:
  - aarch64
  - amd64
# Prebuilt image per architecture (tag = version), built by .github/workflows/images.yml.
# Home Assistant replaces {arch}; without "image" it would build the Dockerfile itself.
image: ghcr.io/g4mm3lha/{arch}-shelly-firmware-manager
# Minimum Home Assistant version
homeassistant: "2026.10.0"

# Core API proxy (device registry, notifications). Of the Supervisor API only
# /addons/self/info (slug for the link to the app page, host port of the download server;
# options of older versions, taken over once), /addons/self/options (emptied after that
# take-over; "network" when the host port is changed in the Settings tab) and
# /addons/self/restart are used (no hassio_api, no host access).
homeassistant_api: true

# Management UI via Ingress only (HA login, admins only).
ingress: true
panel_icon: mdi:download-circle
panel_title: Shelly Firmware

# Download server for the Shellys. Serves firmware files only, no UI.
ports:
  8098/tcp: 8098
ports_description:
  8098/tcp: Firmware downloads for the Shellys (read-only)

# No "map": no access to the Home Assistant configuration folder.
# Firmware, state, settings, passwords, logs and the backups of device settings live in
# the app's private /data. /addons/self/info, /addons/self/options and
# /addons/self/restart are open to every app, so no "hassio_api" permission is needed.

# All settings are in the Settings tab of the app (stored in /data/settings.json). The
# Configuration tab of the app page shows only this field: its name and help text point to
# the Settings tab (HA shows no links or plain text there); its value has no effect.
options:
  settings: ""
schema:
  settings: "str?"
