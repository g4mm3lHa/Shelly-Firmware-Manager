<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shelly Firmware</title><link rel="stylesheet" href="static/style.css?v=__ASSET_VERSION__"></head>
<body>
<header class="titlebar">
<div><h1>Shelly Firmware Manager</h1><div class="meta" id="meta"></div><div class="meta busy" id="busy"></div></div>
<button id="scan" class="primary">Check now</button>
</header>
<!-- Progress of a running check (full or single device), filled by app.js -->
<div id="progress" class="progress" role="status" hidden><span id="progress-text"></span><progress id="progress-bar"></progress></div>
<!-- Download base URL missing or unconfirmed (installations disabled), filled by app.js -->
<div id="notice" class="notice" role="alert" hidden></div>
<!-- Tab icons: Material Design Icons (Apache 2.0), inlined so nothing is loaded externally -->
<nav class="tabs" role="tablist">
<button id="tab-devices" class="tab active" role="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6H21V4H3C1.9 4 1 4.9 1 6V18C1 19.1 1.9 20 3 20H7V18H3V6M13 12H9V13.78C8.39 14.33 8 15.11 8 16C8 16.89 8.39 17.67 9 18.22V20H13V18.22C13.61 17.67 14 16.88 14 16S13.61 14.33 13 13.78V12M11 17.5C10.17 17.5 9.5 16.83 9.5 16S10.17 14.5 11 14.5 12.5 15.17 12.5 16 11.83 17.5 11 17.5M22 8H16C15.5 8 15 8.5 15 9V19C15 19.5 15.5 20 16 20H22C22.5 20 23 19.5 23 19V9C23 8.5 22.5 8 22 8M21 18H17V10H21V18Z"/></svg>Devices</button>
<button id="tab-firmware" class="tab" role="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6,4H18V5H21V7H18V9H21V11H18V13H21V15H18V17H21V19H18V20H6V19H3V17H6V15H3V13H6V11H3V9H6V7H3V5H6V4M11,15V18H12V15H11M13,15V18H14V15H13M15,15V18H16V15H15Z"/></svg>Firmware</button>
<button id="tab-logs" class="tab" role="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5,3C3.89,3 3,3.89 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5C21,3.89 20.1,3 19,3H5M5,5H19V19H5V5M7,7V9H17V7H7M7,11V13H17V11H7M7,15V17H14V15H7Z"/></svg>Logs</button>
<button id="tab-settings" class="tab" role="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12,15.5A3.5,3.5 0 0,1 8.5,12A3.5,3.5 0 0,1 12,8.5A3.5,3.5 0 0,1 15.5,12A3.5,3.5 0 0,1 12,15.5M19.43,12.97C19.47,12.65 19.5,12.33 19.5,12C19.5,11.67 19.47,11.34 19.43,11L21.54,9.37C21.73,9.22 21.78,8.95 21.66,8.73L19.66,5.27C19.54,5.05 19.27,4.96 19.05,5.05L16.56,6.05C16.04,5.66 15.5,5.32 14.87,5.07L14.5,2.42C14.46,2.18 14.25,2 14,2H10C9.75,2 9.54,2.18 9.5,2.42L9.13,5.07C8.5,5.32 7.96,5.66 7.44,6.05L4.95,5.05C4.73,4.96 4.46,5.05 4.34,5.27L2.34,8.73C2.21,8.95 2.27,9.22 2.46,9.37L4.57,11C4.53,11.34 4.5,11.67 4.5,12C4.5,12.33 4.53,12.65 4.57,12.97L2.46,14.63C2.27,14.78 2.21,15.05 2.34,15.27L4.34,18.73C4.46,18.95 4.73,19.03 4.95,18.95L7.44,17.94C7.96,18.34 8.5,18.68 9.13,18.93L9.5,21.58C9.54,21.82 9.75,22 10,22H14C14.25,22 14.46,21.82 14.5,21.58L14.87,18.93C15.5,18.67 16.04,18.34 16.56,17.94L19.05,18.95C19.27,19.03 19.54,18.95 19.66,18.73L21.66,15.27C21.78,15.05 21.73,14.78 21.54,14.63L19.43,12.97Z"/></svg>Settings</button>
</nav>

<section id="view-devices">
<div class="toolbar">
<input id="dev-search" type="search" placeholder="Search name, IP or model" aria-label="Search devices">
<div class="chips" id="dev-chips"></div>
<details class="dropdown" id="cols"><summary>Columns ▾</summary><div class="menu-panel" id="cols-devices"></div></details>
</div>
<div id="dev-cards"></div>
</section>

<section id="view-firmware" hidden>
<div class="toolbar">
<input id="fw-search" type="search" placeholder="Search firmware ID, version or device" aria-label="Search firmware">
<span class="meta" id="fw-summary"></span>
<button class="icon" id="fw-info" aria-label="Storage" data-tip="Firmware is never deleted automatically – delete files here when they are no longer needed. Older versions allow a downgrade of Gen2+ devices (device menu “Downgrade”). The store comes first: a check provides the next higher stored version of a device (downloads and uploads, after a SHA-256 check) and asks the Shelly update server only if nothing newer is stored."></button>
<button id="fw-upload">Upload firmware</button>
</div>
<div id="fw-cards"></div>
</section>

<section id="view-logs" hidden>
<div class="toolbar">
<div class="chips" id="log-chips"></div>
<input id="log-search" type="search" placeholder="Search device" aria-label="Search device">
<label class="check"><input type="checkbox" id="log-quiet"> Hide checks without findings</label>
</div>
<div id="log-list"></div>
</section>

<section id="view-settings" hidden>
<!-- Grouped settings cards and the common Save button, filled by app.js -->
<div id="settings-form"></div>
</section>

<!-- One dialog for everything: title + close, content, buttons bottom right -->
<dialog id="dlg"><div class="dlg-head"><h2 id="dlg-title"></h2><button class="icon" id="dlg-x" aria-label="Close"></button></div>
<div id="dlg-body"></div><div class="btns" id="dlg-btns"></div></dialog>
<div id="tip" class="tooltip" role="tooltip" hidden></div>
<div id="rowmenu" class="rowmenu" role="menu" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="static/app.js?v=__ASSET_VERSION__"></script></body></html>
