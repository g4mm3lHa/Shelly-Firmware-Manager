# Builds the app image for every architecture and pushes it to ghcr.io, where Home
# Assistant pulls it (the "image:" key of shelly_firmware_manager/config.yaml). The tag
# is the version from config.yaml. Runs on the release branches, "beta" and "main", so
# the image exists before a version becomes visible in the app store. An image that
# already exists for the version is kept when the app content is identical (the same
# version arrives again via beta or main); different content fails the run - bump the
# version instead. "Run workflow" with "force" replaces an existing image on purpose.
name: Images

on:
  push:
    branches:
      - main
      - beta
      - "release-*"
  workflow_dispatch:
    inputs:
      force:
        description: Replace an image that already exists for this version
        type: boolean
        default: false

permissions:
  contents: read

# One run per branch at a time; a newer push to the same branch waits for the running build.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Image ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Names of the Home Assistant architectures; native runners, no emulation
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      # Actions are pinned to a commit (the comment names its release); update on purpose only.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Work out image name, version and content hash
        id: meta
        run: |
          version=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' shelly_firmware_manager/config.yaml)
          [ -n "$version" ] || { echo "::error::No version in config.yaml"; exit 1; }
          account=$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
          # Hash of everything the Dockerfile copies into the image (not docs, config or UI sources)
          content=$(git ls-tree HEAD shelly_firmware_manager/Dockerfile shelly_firmware_manager/requirements.txt \
            shelly_firmware_manager/wheels shelly_firmware_manager/app | sha256sum | cut -d' ' -f1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "content=$content" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$account/${{ matrix.arch }}-shelly-firmware-manager" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for an existing image of this version
        id: existing
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          CONTENT: ${{ steps.meta.outputs.content }}
          FORCE: ${{ inputs.force }}
        run: |
          if ! docker buildx imagetools inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          existing=$(docker buildx imagetools inspect "$IMAGE:$VERSION" \
            --format '{{ index .Image.Config.Labels "app.content" }}' 2>/dev/null || true)
          if [ "$FORCE" = "true" ]; then
            echo "::warning::Replacing $IMAGE:$VERSION (forced)"
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [ "$existing" = "$CONTENT" ]; then
            echo "$IMAGE:$VERSION exists with the same content - nothing to do."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::$IMAGE:$VERSION exists with different content. Bump the version, or run the workflow with force."
            exit 1
          fi

      - name: Build and push
        if: steps.existing.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./shelly_firmware_manager
          platforms: ${{ matrix.platform }}
          push: true
          # Plain single-platform image without attestation manifests
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Firmware Manager for Shelly
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.licenses=MIT
            app.content=${{ steps.meta.outputs.content }}

      # Home Assistant pulls without credentials: the package must be public
      - name: Check anonymous access
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          repo=${IMAGE#ghcr.io/}
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:$repo:pull" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/$repo/manifests/$VERSION")
          if [ "$code" != "200" ]; then
            echo "::warning::$IMAGE:$VERSION is not readable without a login (HTTP $code). Set the package visibility to public."
          fi
