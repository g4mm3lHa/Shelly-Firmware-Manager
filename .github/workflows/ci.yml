# Checks on every push and pull request: the development checks (lint, type check,
# UI build check, version match, backend tests) and the linter for the app definition.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, build check and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the check tools
        run: pip install ruff mypy pytest
      - name: Run tools/dev/check.sh
        run: tools/dev/check.sh

  addon-linter:
    name: App definition linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint config.yaml and the app folder
        uses: frenck/action-addon-linter@v2
        with:
          path: ./shelly_firmware_manager
