# Checks on every push: the development checks (lint, type check, UI build check, version
# match, backend tests) and the linter for the app definition. Pull requests from forks
# are checked as well; one from a branch of this repository is covered by its push.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, build check and tests
    # A pull request from a branch of this repository is already checked by its push
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit (the comment names its release); the check tools
      # to the versions the checks were last run with. Update both on purpose only.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the check tools
        run: pip install ruff==0.16.9 mypy==2.3.1 pytest==9.1.1
      - name: Run tools/dev/check.sh
        run: tools/dev/check.sh

  addon-linter:
    name: App definition linter
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Lint config.yaml and the app folder
        uses: frenck/action-addon-linter@d51677290aef26cdfc835271dd3c7343ce502809 # v2.21.2
        with:
          path: ./shelly_firmware_manager
