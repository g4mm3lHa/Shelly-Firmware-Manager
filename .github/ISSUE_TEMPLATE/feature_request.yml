name: Feature request
description: An idea for a new function or an improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The app works locally: requests that need a cloud service, telemetry or resources
        from the internet cannot be accepted.
  - type: textarea
    id: problem
    attributes:
      label: Which problem should be solved?
      description: Describe the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true
  - type: input
    id: devices
    attributes:
      label: Shelly models and generations it concerns
      placeholder: "all Gen2+ devices"
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you use today
